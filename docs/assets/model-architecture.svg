  <polyline points="640,670 640,710" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <polyline points="640,835 640,840 320,840 320,870" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <polyline points="640,840 960,840 960,870" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="985" y="835" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Reuse original latent prefix</text>
  <polyline points="570,965 710,965" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="640" y="932" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">Trimmed</text>
  <text x="640" y="950" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">timestamps</text>
  <polyline points="320,1040 320,1098 520,1098 520,1140" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <polyline points="960,1040 960,1098 760,1098 760,1140" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <polyline points="70,990 38,990 38,850 115,850 115,870" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <polyline points="1210,990 1242,990 1242,850 1165,850 1165,870" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <text x="320" y="1070" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">Previous argmax block → one-hot feedback</text>
  <text x="960" y="1070" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">Previous argmax block → one-hot feedback</text>
  <text x="640" y="1125" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">Random score weighting applies to both generators</text>
  <text x="640" y="1384" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">Block length = 16 · existing timing/lighting offsets are documented in docs/model-architecture.md</text>
</svg>
